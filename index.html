<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#bfefff" />
  <title>盾を構えとけば何とか凌げる - Prototype 122</title>
  <link rel="stylesheet" href="style.css" />

<style>
#versionBadge{position:fixed;top:10px;right:10px;z-index:9999;background:rgba(0,0,0,.65);color:white;
font:700 14px/1.2 system-ui,sans-serif;padding:7px 10px;border-radius:9px;pointer-events:none}
</style>

<style>
.equipPanel{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.36);display:flex;align-items:center;justify-content:center}
.equipPanel.hidden{display:none}
.equipCard{width:min(88vw,420px);background:rgba(248,252,255,.97);border:5px solid #111;border-radius:22px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.28);font-family:system-ui,sans-serif}
.equipTitle{font-weight:900;font-size:22px;text-align:center;margin-bottom:10px}
.equipTab{width:48%;padding:10px;margin:1%;border:3px solid #111;border-radius:14px;background:#d9edf8;font-weight:800}
.equipTab.active{background:#ffe37a}
.equipItems{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.equipItem{padding:12px 8px;border:3px solid #111;border-radius:14px;background:white;font-weight:800}
.equipItem.locked{opacity:.35}
.equipItem.selected{background:#c9f1ff}
.equipClose{width:100%;padding:11px;border:3px solid #111;border-radius:14px;background:#222;color:white;font-weight:900}
</style>

</head>
<body>
<div id="versionBadge">Prototype 122</div>

  <main id="app">
    <div id="startMenu" class="start-menu"><div class="start-card"><div class="start-title">盾を構えとけば何とか凌げる</div><div class="start-ver">Prototype 122</div><button id="continueBtn" class="start-choice">続きから</button><button id="newGameBtn" class="start-choice secondary">最初から</button><div class="save-note">進行状況はこの端末に自動保存されます</div></div></div>
<canvas id="game" aria-label="game canvas"></canvas>

    <div id="hud">
      <div class="hpbox"><span>HP</span><div class="hpbar"><i id="hpfill"></i></div></div>
      <div id="weaponName">剣</div><div id="leafStock">🍃 0</div>
      <button id="mapBtn" class="mapBtn">マップへ</button>
    </div>

    <div id="controls">
      <div id="stickZone" class="stick-zone" aria-label="移動スティック">
        <div class="stick-base"><div id="stickKnob" class="stick-knob"></div></div>
      </div>

      

      <div class="equip-quick">
        <button id="changeBtn" class="btn change">チェンジ</button>
        <button id="shortcutBtn" class="btn shortcut">SHORT <span id="shortcutLabel">なし</span></button>
      </div>

      <div class="action-cluster">
        <button id="shieldBtn" class="btn shield">盾</button>
        <button id="attackBtn" class="btn attack">攻撃</button>
        <button id="jumpBtn" class="btn jump">ジャンプ</button>
        <button id="skillBtn" class="btn skill">スキル</button>
      </div>
    </div>

    <div id="message">盾はかなり強い。困ったら構えよう。</div>
  </main>
<div id="equipPanel" class="equipPanel hidden">
  <div class="equipCard">
    <div class="equipTitle">装備チェンジ</div>
    <button id="equipWeaponTab" class="equipTab active">武器</button>
    <button id="equipShieldTab" class="equipTab">盾</button>
    <div id="equipItems" class="equipItems"></div>
    <button id="equipClose" class="equipClose">閉じる</button>
  </div>
</div>
  
<div id="areaPanel" class="areaPanel hidden"><div class="areaCard">
<div class="areaTitle">浮遊大陸マップ</div><div class="areaSub">行き先を選択</div>
<button id="area1Btn" class="areaBtn">エリア1　草原群島<br><small>クリア済み・戻る</small></button>
<button id="area2Btn" class="areaBtn">エリア2　風の庭園<br><small>未到達</small></button>
<button id="areaMapClose" class="areaClose">ゲームに戻る</button>
</div></div>
<script src="game.js" defer></script>

</body>
</html>
